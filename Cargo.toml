[package]
name = "whatsapp-browser"
version = "0.1.0"
edition = "2021"
description = "Navegador leve e minimalista em Rust exclusivo para múltiplos WhatsApp Web com cookies independentes"

[[bin]]
name = "WhatsAppBrowser"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
